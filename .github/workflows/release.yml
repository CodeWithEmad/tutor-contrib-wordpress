name: Release

# PyPI publishing lives in publish-pypi.yml.
on:
  push:
    tags:
      - "v*"
  # Re-run the image build for an existing tag (e.g. after a failed run)
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to build the image from (e.g. v2.0.0)
        required: true

jobs:
  github_release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install scriv
      - name: Create or update GitHub release
        run: scriv github-release --repo=codewithemad/tutor-contrib-wordpress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_and_push_image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: docker/setup-buildx-action@v4
      - name: Install Tutor and this plugin (from the tagged checkout)
        run: |
          pip install tutor .
          tutor config save
          tutor plugins enable wordpress
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push WordPress image
        run: |
          tutor images build wordpress
          tutor images push wordpress
